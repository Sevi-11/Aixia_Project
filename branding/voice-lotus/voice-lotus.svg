<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="aixia-lotus" aria-hidden="true" focusable="false">
  <!--
    Aixia voice lotus. Geometry is byte-identical to branding/AIxia-Logo/icon/icon.svg.
    Everything pivots on the base anchor 100,148 (the seed sits at 100,144 on its own origin).

    Per-element custom properties consumed by voice-lotus.css:
      --d  direction   -1 left | 0 centre | +1 right
      --m  tier travel  1 outer | .55 mid | 0 centre
      --s  sequence     stagger index for wave/ripple animations
      --r  phase        scattered index so the speaking state does not pump in unison
  -->
  <g class="bloom">
    <!-- listening ripples; opacity 0 until .is-listening -->
    <path class="rip" d="M 42,172 Q 100,188 158,172" fill="none" stroke="var(--lotus-seed, #E8A93C)" stroke-width="4" stroke-linecap="round" style="--s:0"/>
    <path class="rip" d="M 42,172 Q 100,188 158,172" fill="none" stroke="var(--lotus-seed, #E8A93C)" stroke-width="4" stroke-linecap="round" style="--s:1"/>
    <path class="rip" d="M 42,172 Q 100,188 158,172" fill="none" stroke="var(--lotus-seed, #E8A93C)" stroke-width="4" stroke-linecap="round" style="--s:2"/>

    <!-- outer tier -->
    <path class="pt t1" d="M 100.00,148.00 C 65.79,160.06 33.60,137.22 25.83,118.03 C 44.75,109.63 83.77,115.56 100.00,148.00 Z" fill="var(--lotus-o, #F0B49A)" style="--d:-1;--m:1;--s:0;--r:0"/>
    <path class="pt t1" d="M 100.00,148.00 C 116.23,115.56 155.25,109.63 174.17,118.03 C 166.40,137.22 134.21,160.06 100.00,148.00 Z" fill="var(--lotus-o, #F0B49A)" style="--d:1;--m:1;--s:1;--r:3"/>

    <!-- mid tier -->
    <path class="pt t2" d="M 100.00,148.00 C 54.84,138.27 38.62,92.47 45.20,66.75 C 71.51,70.28 107.90,102.48 100.00,148.00 Z" fill="var(--lotus-m, #E68A63)" style="--d:-1;--m:.55;--s:2;--r:5"/>
    <path class="pt t2" d="M 100.00,148.00 C 92.10,102.48 128.49,70.28 154.80,66.75 C 161.38,92.47 145.16,138.27 100.00,148.00 Z" fill="var(--lotus-m, #E68A63)" style="--d:1;--m:.55;--s:3;--r:1"/>

    <!-- centre petal: holds still, scales only. This is what keeps the silhouette legible at full amplitude. -->
    <path class="pt t3" d="M 100.00,148.00 C 62.00,109.92 76.44,56.16 100.00,36.00 C 123.56,56.16 138.00,109.92 100.00,148.00 Z" fill="var(--lotus-c, #D9663F)" style="--d:0;--m:0;--s:4;--r:4"/>

    <circle class="seed" cx="100" cy="144" r="12" fill="var(--lotus-seed, #E8A93C)"/>
    <path class="water" d="M 42,172 Q 100,188 158,172" fill="none" stroke="var(--lotus-water, #3B4657)" stroke-width="5" stroke-linecap="round"/>
    <!-- flattened water, shown only in .is-trouble / .is-muted (CSS `d:` is not
         supported in Safari, so this is a second path rather than a path swap) -->
    <path class="water-flat" d="M 42,174 L 158,174" fill="none" stroke="var(--lotus-water, #3B4657)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
