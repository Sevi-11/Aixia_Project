services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aixia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aixia_db
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,*
      CORS_ALLOW_ALL_ORIGINS: "True"
    volumes:
      - media:/app/media
      - chroma:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  chroma:
