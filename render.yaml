# Render Blueprint for the Aixia backend.
#
# Create it from Dashboard -> New -> Blueprint, pointed at this repository.
# Values marked "sync: false" are secrets: Render prompts for them during
# Blueprint creation and they are never committed here. Render only prompts on
# FIRST creation -- anything added later has to be set by hand in the dashboard.

services:
  - type: web
    name: aixia-backend
    runtime: docker
    plan: free
    # Must match the Supabase project's region (ap-southeast-1 = Singapore).
    # A chat request makes several database round trips -- session lookup,
    # message insert, vector search, message insert -- so a cross-Pacific split
    # would add roughly 180ms to each one. Render cannot change a service's
    # region after creation, so this has to be right the first time.
    region: singapore

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Cheap liveness probe that does not touch the database, and is exempt from
    # the HTTPS redirect -- Render probes over plain HTTP internally, and a 301
    # would read as unhealthy and kill a working deploy.
    healthCheckPath: /healthz/

    # Migrations run here because Render's preDeployCommand is paid-tier only.
    #
    # One worker, not the Dockerfile's three: the free tier has 512 MB and each
    # worker is a full copy of the app. Threads rather than processes because
    # the chat endpoint streams -- a sync worker is tied up for the entire
    # length of a response, so a single-threaded worker would serve exactly one
    # conversation at a time. The raised timeout is the same story: a streamed
    # answer legitimately outlives the 30s default.
    # A plain path, not an inline shell command. Render already runs this
    # through a shell, so a self-wrapped sh -c "a && b" is read as one command
    # name and dies with exit 127 before anything starts.
    dockerCommand: /app/start.sh

    envVars:
      - key: DJANGO_DEBUG
        value: "False"

      # A randomised, base64-encoded 256-bit value. Django's check --deploy
      # warns under 50 characters and this is 44, but that threshold is a proxy
      # for entropy -- 256 random bits comfortably exceeds what a 50-character
      # passphrase carries. Letting Render generate it also means the secret
      # never passes through a clipboard.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Supabase SESSION POOLER url -- port 5432 on the aws-N-<region>.pooler
      # .supabase.com host. Not the direct connection Supabase shows first:
      # that one is IPv6-only and Render cannot reach it. Session mode rather
      # than transaction mode (6543) because langchain-postgres uses psycopg3,
      # whose prepared statements break under transaction pooling.
      - key: DATABASE_URL
        sync: false

      # Chat model.
      - key: GROQ_API_KEY
        sync: false
      # f_chains.py has a fallback default, so production would boot without
      # this -- but it would then quietly run a different model than local dev.
      # Declared so the choice is explicit rather than implied.
      - key: GROQ_MODEL
        sync: false
      # Embeddings AND general-mode chat. A different provider because Groq
      # serves no embeddings endpoint -- and because general mode must not
      # share Groq's per-minute output ceiling with grounded answers.
      - key: GOOGLE_API_KEY
        sync: false
      # General-mode model. f_chains.py has a working fallback, so production
      # boots without this -- declared for the same reason as GROQ_MODEL, so
      # the choice is explicit rather than implied. Note gemini-2.5-flash is
      # closed to new API keys and 404s; the fallback is gemini-3.6-flash.
      - key: GENERAL_MODEL
        sync: false

      # ALLOWED_HOSTS is deliberately absent: settings.py already appends
      # RENDER_EXTERNAL_HOSTNAME, which Render injects. Add it by hand only if
      # you attach a custom domain.
      #
      # Both of these are the frontend's public URL, so they are committed as
      # literal `value:` entries rather than left to the dashboard.
      #
      # `sync:` takes a BOOLEAN and nothing else -- it means "this one is not
      # managed here, prompt for it instead". A URL after `sync:` is not a way
      # to supply the value; it is invalid, and the variable ends up unset.
      # `value:` is what carries a literal. The difference also decides whether
      # the setting ever reaches an existing service: `value:` entries are
      # re-applied whenever the blueprint syncs, while `sync: false` entries
      # are prompted for once at creation and never touched again.
      #
      # These are public URLs, not secrets, so committing them costs nothing
      # and makes the deployment reproducible.
      #
      # CSRF_TRUSTED_ORIGINS is what makes the proxied Django admin work at
      # all. The frontend proxies /admin and /api to this service, so a login
      # POST arrives carrying the FRONTEND's Origin; Django validates that
      # against this list and 403s the login without it -- which reads as "the
      # upload is still broken" rather than as a missing setting.
      #
      # Note the scheme is required here (https://...), while ALLOWED_HOSTS
      # must not have one.
      - key: CSRF_TRUSTED_ORIGINS
        value: https://aixia-project.vercel.app
      # Not strictly required while every browser request is same-origin via
      # the frontend's proxy, but correct for anything calling the API
      # directly. Setting it REPLACES the localhost defaults in settings.py,
      # which is what you want in production.
      - key: CORS_ALLOWED_ORIGINS
        value: https://aixia-project.vercel.app

      # Supabase Storage, which speaks the S3 protocol. Without these, uploads
      # land on the container filesystem and are destroyed on the next deploy.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
